services:
  frontend:
    image: ${REGISTRY:-docker.io}/${FRONTEND_IMAGE:-libmarket-frontend}:${VERSION:-latest}
    container_name: libmarket-frontend-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
    depends_on:
      - backend
    networks:
      - libmarket-network
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  backend:
    image: ${REGISTRY:-docker.io}/${BACKEND_IMAGE:-libmarket-backend}:${VERSION:-latest}
    container_name: libmarket-backend-prod
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_DIALECT=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-libmarket}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_SSL=false
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRE=${JWT_EXPIRE:-7d}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
      - USE_CLOUD_STORAGE=${USE_CLOUD_STORAGE:-false}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - libmarket-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => r.statusCode === 200 ? process.exit(0) : process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    volumes:
      - backend-uploads:/app/uploads

  db:
    image: postgres:16-alpine
    container_name: libmarket-db-prod
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-libmarket}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - libmarket-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backup:
    image: postgres:16-alpine
    container_name: libmarket-backup-prod
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-libmarket}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGHOST=db
      # Off-site backup (optional — leave RESTIC_REPOSITORY unset to skip
      # entirely and keep the old local-only behavior). See
      # DOCKER-DEPLOYMENT.md for how to set these up with Backblaze B2.
      - RESTIC_REPOSITORY=${RESTIC_REPOSITORY:-}
      - RESTIC_PASSWORD=${RESTIC_PASSWORD:-}
      - B2_ACCOUNT_ID=${B2_ACCOUNT_ID:-}
      - B2_ACCOUNT_KEY=${B2_ACCOUNT_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - libmarket-network
    volumes:
      - db-backups:/backups
      - backend-uploads:/uploads:ro
    entrypoint: >
      sh -c '
        apk add --no-cache restic >/dev/null 2>&1;
        if [ -n "$$RESTIC_REPOSITORY" ]; then
          restic snapshots >/dev/null 2>&1 || restic init;
        fi;
        while true; do
          FILE="/backups/libmarket-$$(date +%Y%m%d-%H%M%S).sql";
          if pg_dump -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -f "$$FILE"; then
            gzip "$$FILE" && echo "Backup written: $$FILE.gz";
            if [ -n "$$RESTIC_REPOSITORY" ]; then
              restic backup /backups /uploads --tag libmarket \
                && echo "Off-site backup complete" \
                || echo "Off-site backup FAILED" >&2;
              restic forget --keep-daily 14 --keep-weekly 8 --prune >/dev/null 2>&1 || true;
            fi;
          else
            echo "Backup FAILED" >&2;
            rm -f "$$FILE";
          fi;
          find /backups -name "*.sql.gz" -mtime +14 -delete;
          sleep 86400;
        done
      '

volumes:
  db-data:
    driver: local
  backend-uploads:
    driver: local
  db-backups:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local

networks:
  libmarket-network:
    driver: bridge
